name: face_verification_sdk
description: Production-ready Face Verification SDK for Flutter applications.
version: 1.0.0

homepage: https://github.com/your-company/face_verification_sdk

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  google_mlkit_face_detection: ^0.13.2
  google_mlkit_commons: ^0.11.1
  image: ^4.5.4

  onnxruntime: ^1.4.1
  path_provider: ^2.1.5
  camera: ^0.12.0+2
dev_dependencies:
  flutter_test:
    sdk: flutter
 
  flutter_lints: ^5.0.0

flutter:

  assets:
    - assets/models/
    - assets/sample_data/
    - assets/models/w600k_r50.onnx


  uses-material-design: true

